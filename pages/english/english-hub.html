<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 친구들 · 30일 영어 코스 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/study-foundation.css">
<link rel="stylesheet" href="../../assets/css/english-hub.css">
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>영어 친구들과 <span class="gradient-text">30일 영어</span></h1>
    <p>동물 선생님을 하나 골라 매일 다섯 개씩, 즐겁게 시작해요.</p>
  </div>

  <div class="total-bar">
    <span class="label">전체 진행</span>
    <div class="track"><div class="fill" id="totalFill"></div></div>
    <span class="num"><span id="totalDone">0</span> / <span id="totalAll">180</span>일</span>
  </div>

  <div class="grid-toolbar"><button class="toggle-done-btn" id="toggleDone" type="button"><i class="ic" data-icon="eye"></i>완료한 과정 보이기</button></div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    <i class="ic" data-icon="bulb"></i> <b>부모님께</b> · 한 코스는 30일, 모두 6코스예요. 아이가 좋아하는 캐릭터부터 천천히 시작해 주세요.<br>
    카드를 누르면 그 선생님의 30일 영어가 열립니다.
  </div>
</div>

<script src="../../assets/js/icons.js"></script>
<script src="../../assets/data/english-hub.js"></script>
<script src="../../assets/js/hub-page.js"></script>
</body>
</html>
