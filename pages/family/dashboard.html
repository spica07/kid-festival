<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'self';">
<title>학습 대시보드</title>
<link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
  <main class="dashboard-shell">
    <section class="dash-hero">
      <div>
        <p class="eyebrow">학습 대시보드</p>
        <h1>오늘 어디까지 왔는지 한눈에 확인해요</h1>
      </div>
      <div class="hero-actions">
        <button class="action-btn" id="exportProgress" type="button">진도 내보내기</button>
        <button class="action-btn secondary" id="importProgress" type="button">진도 가져오기</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </section>

    <section class="summary-grid" aria-label="전체 학습 요약">
      <article class="summary-card">
        <span class="label">전체 완료</span>
        <strong id="overallDone">0</strong>
        <span id="overallTotal">/ 0</span>
      </article>
      <article class="summary-card">
        <span class="label">전체 진행률</span>
        <strong id="overallPercent">0%</strong>
        <div class="mini-bar"><span id="overallBar"></span></div>
      </article>
      <article class="summary-card">
        <span class="label">연속 학습</span>
        <strong id="overallStreak">0일</strong>
        <span id="weeklyStudy">이번 주 0/5일</span>
      </article>
    </section>

    <section class="section-block">
      <h2>과목별 진행</h2>
      <div class="subject-grid" id="subjectGrid"></div>
    </section>

    <section class="section-block">
      <h2>진행 중인 코스</h2>
      <div class="course-list" id="courseList"></div>
    </section>

    <p class="status-line" id="backupStatus" role="status" aria-live="polite"></p>
  </main>

  <script src="../../assets/data/site-catalog.js"></script>
  <script src="../../assets/js/pages/dashboard.js"></script>
</body>
</html>
