<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';">
<title>메모리 카드 짝 맞추기</title>
<link rel="stylesheet" href="../../assets/css/board-game.css">
</head>
<body>
  <main class="game-page">
    <div class="memory-topbar">
      <a class="back-link" href="board-game-hub.html">← 보드게임 목록</a>
      <div class="control-groups">
        <div class="level-group" role="group" aria-label="언어 선택" id="modeGroup">
          <button class="level-btn active" type="button" data-mode="ko">한글</button>
          <button class="level-btn" type="button" data-mode="en">English</button>
        </div>
        <div class="level-group" role="group" aria-label="난이도 선택">
          <button class="level-btn" type="button" data-pairs="6">쉬움</button>
          <button class="level-btn active" type="button" data-pairs="8">보통</button>
          <button class="level-btn" type="button" data-pairs="10">어려움</button>
        </div>
      </div>
    </div>

    <section class="hub-hero" style="margin-bottom:14px;">
      <h1>메모리 카드 짝 맞추기</h1>
      <p class="lead">같은 카드 두 장을 찾아보세요! 카드를 뒤집으면 단어를 읽어줘요. 🔊</p>
    </section>

    <div class="memory-stats" aria-live="polite">
      <div class="stat-chip"><span class="stat-label">짝</span><span class="stat-value" id="statMatched">0 / 0</span></div>
      <div class="stat-chip"><span class="stat-label">시도</span><span class="stat-value" id="statMoves">0</span></div>
      <div class="stat-chip"><span class="stat-label">시간</span><span class="stat-value" id="statTime">0초</span></div>
      <div class="stat-chip"><span class="stat-label">최고기록</span><span class="stat-value" id="statBest">-</span></div>
    </div>

    <div id="memoryBoard" class="memory-board" aria-label="메모리 카드 판"></div>

    <div class="memory-win" id="memoryWin" hidden>
      <h2>🎉 잘했어요!</h2>
      <p id="winText">모든 짝을 찾았어요.</p>
      <button class="play-again" id="playAgain" type="button">다시 하기</button>
    </div>
  </main>

  <script src="../../assets/js/course-common.js"></script>
<script src="../../assets/js/pages/memory-game.js"></script>
</body>
</html>
