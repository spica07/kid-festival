<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';">
<title>무지개 숲 주사위 여행</title>
<link rel="stylesheet" href="../../assets/css/board-game.css">
</head>
<body>
  <main class="game-page">
    <div class="memory-topbar">
      <a class="back-link" href="board-game-hub.html">← 보드게임 목록</a>
      <div class="control-groups">
        <div class="level-group" role="group" aria-label="함께 놀 친구 수" id="countGroup">
          <button class="level-btn active" type="button" data-count="2">2명</button>
          <button class="level-btn" type="button" data-count="3">3명</button>
          <button class="level-btn" type="button" data-count="4">4명</button>
        </div>
        <div class="level-group">
          <button class="level-btn active" type="button" id="soundBtn" aria-pressed="true">🔊 소리</button>
        </div>
      </div>
    </div>

    <section class="hub-hero" style="margin-bottom:14px;">
      <h1>🎲 무지개 숲 주사위 여행</h1>
      <p class="lead">주사위를 굴려 무지개 숲을 지나 30번 골인 깃발까지 가요! 무지개를 만나면 슝~ 위로, 구름 미끄럼틀은 주르륵~ 아래로, 별님을 만나면 한 번 더!</p>
    </section>

    <div class="dj-status" id="djStatus" aria-live="polite">주사위를 눌러서 시작해요!</div>

    <div class="dj-layout">
      <div class="dj-side">
        <div class="dj-dice-wrap">
          <div class="dj-dice" id="djDice" aria-hidden="true"></div>
          <button class="dj-roll" id="djRoll" type="button">🎲 주사위 굴리기!</button>
        </div>
        <div class="dj-players" id="djPlayers" aria-label="참가자 순서"></div>
        <div class="dj-start" id="djStart">
          <span class="dj-start-label">🚩 출발</span>
          <span class="dj-tok" id="djStartTok"></span>
        </div>
      </div>

      <div class="dj-board-wrap">
        <div class="dj-board" id="djBoard" aria-label="무지개 숲 말판"></div>
      </div>
    </div>

    <div class="memory-win" id="djWin" hidden>
      <h2 id="djWinTitle">🎉 도착!</h2>
      <p id="djWinText"></p>
      <button class="play-again" id="djAgain" type="button">다시 하기</button>
    </div>
  </main>

  <div class="dj-confetti" id="djConfetti" aria-hidden="true"></div>

  <script src="../../assets/js/course-common.js"></script>
<script src="../../assets/js/pages/dice-adventure.js"></script>
</body>
</html>
