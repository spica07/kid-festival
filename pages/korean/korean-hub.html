<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글 친구들 · 글씨 쓰기와 문해력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/study-foundation.css">
<link rel="stylesheet" href="../../assets/css/korean-hub.css">
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>한글 친구들과 <span class="gradient-text">또박또박 우리말</span></h1>
    <p>자음·모음 쓰기부터 문해력까지, 오늘 배울 것을 하나 골라보세요.</p>
  </div>
  <div class="total-bar">
    <span class="label">전체 진행</span>
    <div class="track"><div class="fill" id="totalFill"></div></div>
    <span class="num"><span id="totalDone">0</span> / <span id="totalAllNum">44</span></span>
  </div>
  <div class="grid-toolbar"><button class="toggle-done-btn" id="toggleDone" type="button"><i class="ic" data-icon="eye"></i>완료한 과정 보이기</button></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <i class="ic" data-icon="bulb"></i> <b>부모님께</b> · 글씨 쓰기는 따라 쓰며 소리 내어, 문해력은 낱말과 예문을 함께 읽어 주세요.<br>
    카드를 누르면 해당 학습이 열립니다.
  </div>
</div>
<script src="../../assets/js/icons.js"></script>
<script src="../../assets/data/korean-hub.js"></script>
<script src="../../assets/js/hub-page.js"></script>
</body>
</html>
