<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코야 기초 어휘 30일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/korean-vocab-30days.css">
</head>
<body>
<div class="container">
  <div class="topbar"><a class="back-hub" href="korean-hub.html">← 한글 허브</a><span class="page-title">🐨 코야 기초 어휘 30일</span></div>
  <div class="mascot-row">
    <div class="mascot">🐨</div>
    <div class="bubble" id="leoBubble">안녕! 나는 코야야. 오늘도 낱말 다섯 개 배워볼까?</div>
  </div>
  <div class="day-toolbar">
    <span class="day-toolbar-label">📅 <b id="dayLabel">Day 1</b></span>
    <button class="day-pick-btn" id="dayPickBtn" type="button">날짜 선택 ⋯</button>
  </div>
  <div class="day-panel" id="dayPanel" hidden>
    <div class="day-grid" id="dayGrid"></div>
  </div>
  <div class="lesson" id="lesson"></div>
  <div class="progress-wrap">
    <div class="progress-top"><span>나의 30일 도전</span><span class="count"><span id="doneCount">0</span> / 30일 완료</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="foot">
    💡 <b>부모님께</b> · 낱말과 예문을 소리 내어 함께 읽어 주세요. 🔊 버튼으로 발음을 듣고, 그림을 보며 뜻을 우리 생활과 연결해 이야기하면 더 좋아요.
    <br><button class="reset-btn" id="resetBtn">진행 기록 모두 지우기</button>
  </div>
</div>
<script src="../../assets/data/korean-vocab-30days.js"></script>
<script src="../../assets/js/course-common.js"></script>
<script src="../../assets/js/korean-course.js"></script>

</html>
