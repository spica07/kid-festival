<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 친구들 · 사고력 수학 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/study-foundation.css">
<link rel="stylesheet" href="../../assets/css/math-hub.css">
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>수학 친구들과 <span class="gradient-text">생각하는 힘</span></h1>
    <p>캐릭터를 하나 골라 하루 다섯 문제씩, 사고력을 키워가요.</p>
  </div>
  <div class="total-bar">
    <span class="label">전체 진행</span>
    <div class="track"><div class="fill" id="totalFill"></div></div>
    <span class="num"><span id="totalDone">0</span> / <span id="totalAll">30</span>일</span>
  </div>
  <div class="grid-toolbar"><button class="toggle-done-btn" id="toggleDone" type="button"><i class="ic" data-icon="eye"></i>완료한 과정 보이기</button></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <i class="ic" data-icon="bulb"></i> <b>부모님께</b> · 문제를 함께 소리 내어 읽고, 블록·사탕으로 직접 세어 보게 해주세요.<br>
    카드를 누르면 셈여우의 30일 수학이 열립니다.
  </div>
</div>
<script src="../../assets/js/icons.js"></script>
<script src="../../assets/data/math-hub.js"></script>
<script src="../../assets/js/hub-page.js"></script>
</body>
</html>
